name: Backend tests

on:
  pull_request:
  push:
    branches:
      - feature/approval-gated-ai-scripts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mock backend tests
        run: node --test backend/worker.test.mjs

name: Orange Juice AI checks

on:
  pull_request:
  push:
    branches:
      - feature/approval-gated-ai-scripts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mock backend tests
        run: node --test backend/worker.test.mjs
      - name: Install Lua syntax checker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Parse Roblox Studio plugin source
        run: luac5.4 -p RobloxAIDeveloper.lua
